name: joinery-development
services:
  redis:
    image: redis:8.2-alpine
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "joinery-redis-local-only", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "joinery-redis-local-only", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: joinery
      POSTGRES_PASSWORD: joinery-local-only
      POSTGRES_DB: joinery
    ports:
      - "127.0.0.1:${JOINERY_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./tests/fixtures/postgres.sql:/docker-entrypoint-initdb.d/001-fixtures.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joinery -d joinery"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
